name: Re-verification check

# Flags sheets nearing staleness (150 days) before the public "may be
# stale" badge appears at 180 — specs/09-quality-bar.md#re-verification.
# `lastVerified` itself is never auto-bumped by this or any workflow: it
# is a human assertion that someone re-read the primary source.
#
# Also checks that every companion video is still public and embeddable
# (job `check-videos`, below).

on:
  schedule:
    - cron: '0 9 * * 1' # weekly, Monday 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Find sheets past 150 days
        id: find
        run: |
          cat > /tmp/find-stale.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import fg from 'fast-glob';
          import matter from 'gray-matter';

          const THRESHOLD_DAYS = 150;
          const files = await fg('src/content/docs/**/*.md');
          const stale = [];

          for (const file of files) {
            const { data } = matter(readFileSync(file, 'utf8'));
            const cs = data.cheatsheet;
            if (!cs?.lastVerified) continue;
            const ageDays = (Date.now() - new Date(cs.lastVerified).getTime()) / 86_400_000;
            if (ageDays > THRESHOLD_DAYS) {
              stale.push(`- \`${cs.slug}\` (${file}) — last verified ${Math.round(ageDays)} days ago`);
            }
          }

          console.log(stale.length > 0 ? stale.join('\n') : '');
          EOF
          RESULT=$(node /tmp/find-stale.mjs)
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.find.outputs.list != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `The following sheets are past 150 days since \`lastVerified\` and should be re-checked against their primary sources before the public staleness badge appears at 180 days:\n\n${{ steps.find.outputs.list }}\n\n\`lastVerified\` should only be updated after someone actually re-reads the primary source — never bump it just to silence this issue.`;
            const title = 'Sheets due for re-verification';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['re-verification'],
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['re-verification'],
              });
            }

  # Companion videos (`cheatsheet.video`) can go private, be deleted, or have
  # embedding turned off at any time, and the page card would then open a
  # player saying "Video unavailable". Checked here rather than in CI or
  # deploy because it depends on YouTube, and a third-party outage must not
  # block a deploy (specs/07-build-and-deploy.md). Network failures and 5xx
  # answers are not reported as problems — see scripts/verify-videos.ts.
  check-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Find unavailable companion videos
        id: find
        run: |
          RESULT=$(npm run --silent verify:videos -- --markdown)
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.find.outputs.list != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `These companion videos can no longer be played on their sheet's page. Pressing play on the card opens a player that says "Video unavailable":\n\n${{ steps.find.outputs.list }}\n\nRe-publish or re-enable embedding on YouTube, or point \`cheatsheet.video\` at a replacement, or remove it.`;
            const title = 'Companion videos unavailable';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['re-verification'],
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['re-verification'],
              });
            }
